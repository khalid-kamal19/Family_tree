<!DOCTYPE html>
<html lang="en" dir="ltr" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family tree — master</title>
<style>
:root{
  --paper:#e9edf0;
  --card:#ffffff;
  --ink:#16232e;
  --muted:#5c7183;
  --rule:#aebecb;
  --edge:#d3dde4;
  --accent:#1f6f6b;
  --accent-wash:#dff0ed;
  --find:#f6e2ad;
  --danger:#9d3a30;
  --sans:"Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans Arabic",sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman","Noto Naskh Arabic",serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  direction:ltr;
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:14px;
  display:flex;flex-direction:column;overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}

.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 16px;background:var(--card);border-bottom:1px solid var(--edge)}
.bar.two{padding-top:0;padding-bottom:9px;border-bottom:1px solid var(--edge)}
#title{
  font-family:var(--serif);font-size:19px;font-weight:600;border:1px solid transparent;
  background:none;border-radius:5px;padding:4px 7px;width:250px;
}
#title:hover{border-color:var(--edge)}
#title:focus{border-color:var(--accent);outline:none;background:#fff}
.count{color:var(--muted);font-size:12.5px;white-space:nowrap}
.spacer{flex:1}
.btn{border:1px solid var(--edge);background:var(--card);border-radius:6px;padding:6px 11px;cursor:pointer}
.btn:hover{border-color:var(--rule);background:#f4f7f9}
.btn.key{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.key:hover{background:#195a57}
.btn.warn{color:var(--danger);border-color:#e6cfcc}
.btn.warn:hover{background:#fbf1f0;border-color:var(--danger)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.node:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sep{width:1px;height:22px;background:var(--edge)}
.saved{color:var(--muted);font-size:12px;white-space:nowrap}

.find{position:relative}
.find input{width:220px;padding:7px 10px;border:1px solid var(--edge);border-radius:6px;background:var(--card)}
.find input::placeholder{color:var(--muted)}
.hits{position:absolute;top:calc(100% + 6px);left:0;width:300px;max-height:320px;overflow:auto;background:var(--card);
  border:1px solid var(--edge);border-radius:8px;box-shadow:0 12px 28px rgba(22,35,46,.16);display:none;z-index:20}
.hits.on{display:block}
.hit{padding:8px 11px;cursor:pointer;border-bottom:1px solid #f0f4f6}
.hit:last-child{border-bottom:0}
.hit:hover,.hit.cursor{background:var(--accent-wash)}
.hit b{font-family:var(--serif);font-weight:600;display:block}
.hit span{color:var(--muted);font-size:12px}
.hits .none{padding:10px 11px;color:var(--muted)}

.main{flex:1;display:flex;min-height:0}
.canvas{flex:1;overflow:auto;padding:34px 40px 90px;min-width:0}
.rail{width:320px;flex:none;background:var(--card);border-left:1px solid var(--edge);overflow:auto;padding:18px 20px 40px}
.rail .empty{color:var(--muted);line-height:1.7}
.rail .empty .btn{margin-top:14px}
.path{font-size:12.5px;color:var(--muted);line-height:1.7;margin-bottom:12px}
.path button{background:none;border:0;padding:0;cursor:pointer;color:var(--accent);text-decoration:underline}
.path .arrow{padding:0 5px;color:var(--rule)}
label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 4px}
.f{width:100%;padding:7px 9px;border:1px solid var(--edge);border-radius:6px;background:var(--card)}
.f:focus{border-color:var(--accent);outline:none}
textarea.f{min-height:64px;resize:vertical;line-height:1.5}
.two-up{display:flex;gap:10px}
.two-up>div{flex:1}
.acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}
.acts .btn{flex:none}
.railhead{font-family:var(--serif);font-size:16px;font-weight:600;margin:0 0 2px}
.hint{color:var(--muted);font-size:12px;line-height:1.6;margin-top:6px}
.divider{height:1px;background:var(--edge);margin:20px 0}

.tree{display:inline-block;min-width:100%}
.tree ul{display:flex;justify-content:center;list-style:none;margin:0;padding:26px 0 0;position:relative}
.tree li{list-style:none;position:relative;padding:26px 7px 0;display:flex;flex-direction:column;align-items:center}
.tree li::before,.tree li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:26px;border-top:1.5px solid var(--rule)}
.tree li::after{right:auto;left:50%;border-top:1.5px solid var(--rule);border-left:1.5px solid var(--rule)}
.tree li:only-child::before,.tree li:only-child::after{display:none}
.tree li:only-child{padding-top:0}
.tree li:first-child::before,.tree li:last-child::after{border:0 none}
.tree li:last-child::before{border-right:1.5px solid var(--rule);border-radius:0 7px 0 0}
.tree li:first-child::after{border-radius:7px 0 0 0}
.tree ul ul::before{content:"";position:absolute;top:0;left:50%;height:26px;border-left:1.5px solid var(--rule)}
.tree>ul{padding-top:0;gap:36px}
.tree>ul>li{padding-top:0}
.tree>ul>li::before,.tree>ul>li::after{display:none}

.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:124px;max-width:200px;
  padding:9px 14px;background:var(--card);border:1px solid var(--edge);border-top:3px solid var(--rule);border-radius:3px;
  cursor:pointer;text-align:center;transition:border-color .12s,box-shadow .12s}
.node.male{border-top-color:#4a7fa5}
.node.female{border-top-color:#a2628c}
.node:hover{border-color:var(--accent)}
.node.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
.node.found{background:var(--find)}
.node .nm{font-family:var(--serif);font-size:15px;line-height:1.3;font-weight:600}
.node .yr{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.node .sp{font-size:11.5px;color:var(--muted);font-style:italic}
.node .kids{position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);min-width:24px;height:20px;padding:0 6px;
  border-radius:10px;background:var(--card);border:1.5px solid var(--rule);color:var(--muted);font-size:11.5px;line-height:17px;
  font-variant-numeric:tabular-nums}
.node.open .kids{background:var(--accent);border-color:var(--accent);color:#fff}
.leaf{cursor:pointer}
.blank{color:var(--muted);padding:60px 0;text-align:center;line-height:1.8}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:10px 16px;border-radius:7px;box-shadow:0 10px 26px rgba(22,35,46,.28);z-index:60;max-width:80vw}
.hide{display:none}

@media (max-width:900px){
  .rail{position:fixed;inset:auto 0 0 0;width:auto;max-height:52vh;padding:12px 18px 26px;
        border-left:0;border-top:1px solid var(--edge);border-radius:13px 13px 0 0;
        box-shadow:0 -8px 24px rgba(22,35,46,.18);transform:translateY(0);transition:transform .18s ease}
  body.rail-off .rail{display:block;transform:translateY(104%);box-shadow:none}
  .sheet-grip{justify-content:space-between}
  .sheet-label{display:block}
  .canvas{padding:20px 16px 56vh}
  body.rail-off .canvas{padding-bottom:88px}
  .fab{display:block}
  body:not(.rail-off) .fab{display:none}
  #title,.find input{width:150px}
}

.sheet-grip{display:flex;align-items:center;justify-content:flex-end;gap:8px;position:sticky;top:0;
  background:var(--card);padding:0 0 8px;z-index:3}
.sheet-label{display:none;font-size:12.5px;color:var(--muted)}
.sheet-grip .x{border:1px solid var(--edge);background:var(--card);border-radius:6px;
  width:30px;height:28px;line-height:1;cursor:pointer;color:var(--muted);font-size:16px;padding:0}
.sheet-grip .x:hover{border-color:var(--rule);color:var(--ink)}
.fab{display:none;position:fixed;right:14px;bottom:14px;z-index:40;max-width:62vw;
  border:1px solid var(--edge);background:var(--card);border-radius:22px;padding:10px 17px;
  box-shadow:0 6px 18px rgba(22,35,46,.2);cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.rail-off .rail{display:none}

@media print{.bar,.rail,.fab{display:none}body{background:#fff;overflow:visible;height:auto}.canvas{overflow:visible;padding:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="bar">
  <input id="title" dir="auto" value="Family tree" aria-label="Name of this tree">
  <span class="count" id="count"></span>
  <div class="find">
    <input id="q" type="search" dir="auto" placeholder="Search for a name" autocomplete="off">
    <div class="hits" id="hits"></div>
  </div>
  <span class="spacer"></span>
  <span class="saved" id="saved"></span>
  <button class="btn key" id="publish">Publish viewer file</button>
</div>

<div class="bar two">
  <button class="btn" id="addRoot">Add person at top</button>
  <span class="sep"></span>
  <button class="btn" id="openJson">Open tree file</button>
  <button class="btn" id="saveJson">Save tree file</button>
  <span class="sep"></span>
  <button class="btn" id="importCsv">Import CSV</button>
  <button class="btn" id="exportCsv">Export CSV</button>
  <span class="sep"></span>
  <button class="btn" id="collapse">Collapse all</button>
  <button class="btn" id="expand">Expand all</button>
  <button class="btn" id="zoomOut">&minus;</button>
  <button class="btn" id="zoomIn">+</button>
  <button class="btn" id="print">Print</button>
  <button class="btn" id="toggleRail" aria-expanded="true">Details panel</button>
  <span class="spacer"></span>
  <button class="btn warn" id="wipe">Start over</button>
</div>

<div class="main">
  <div class="canvas" id="canvas"><div class="tree notranslate" id="tree" translate="no"></div></div>
  <aside class="rail" id="rail">
    <div class="sheet-grip"><span class="sheet-label">Details</span><button class="x" id="closeRail" aria-label="Close the details panel" title="Close">×</button></div>
    <div id="railBody" class="notranslate" translate="no"></div>
  </aside>
</div>

<button class="fab" id="fab">Details</button>
<div class="toast hide" id="toast"></div>
<input type="file" id="filePick" accept=".json,.csv,text/csv,application/json" style="display:none">

var data = {title:"Family tree", people:[]};
var byId = new Map(), kids = new Map();
var open = new Set(), sel = null, found = null, zoom = 1, seq = 0;

var elTree = document.getElementById("tree");
var elRail = document.getElementById("railBody");
var elHits = document.getElementById("hits");
var elQ = document.getElementById("q");
var elTitle = document.getElementById("title");
var elSaved = document.getElementById("saved");
var elToast = document.getElementById("toast");
var elFile = document.getElementById("filePick");

/* ---------------- data helpers ---------------- */
var canZoom = !!(window.CSS && CSS.supports && CSS.supports("zoom","1.5"));
function applyZoom(){
  if(canZoom){ elTree.style.zoom = zoom; }
  else { elTree.style.transform = "scale(" + zoom + ")"; elTree.style.transformOrigin = "top center"; }
}
function index(){
  byId.clear(); kids.clear();
  data.people.forEach(function(p){ byId.set(p.id, p); });
  data.people.forEach(function(p){
    var k = (p.parentId && byId.has(p.parentId) && p.parentId !== p.id) ? p.parentId : "__root__";
    if(!kids.has(k)) kids.set(k, []);
    kids.get(k).push(p);
  });
}
function childrenOf(id){ return kids.get(id) || []; }
function roots(){ return kids.get("__root__") || []; }
function years(p){
  if(p.birth && p.death) return p.birth + " \u2013 " + p.death;
  if(p.birth) return "b. " + p.birth;
  if(p.death) return "d. " + p.death;
  return "";
}
function newId(){
  var id;
  do { seq++; id = "p" + seq; } while(byId.has(id));
  return id;
}
function descendants(id){
  var out = [], stack = [id], guard = 0;
  while(stack.length && guard++ < 100000){
    var cur = stack.pop();
    childrenOf(cur).forEach(function(c){ out.push(c.id); stack.push(c.id); });
  }
  return out;
}

/* ---------------- storage ---------------- */
var storageOk = true;
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(data));
    elSaved.textContent = "Saved in this browser";
  }catch(e){
    storageOk = false;
    elSaved.textContent = "Not saved automatically \u2014 use Save tree file";
  }
}
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var d = JSON.parse(raw);
      if(d && Array.isArray(d.people)) adopt(d);
    }
  }catch(e){ storageOk = false; }
}
function adopt(d){
  data = {title: d.title || "Family tree", people: []};
  (d.people || []).forEach(function(p){
    data.people.push({
      id: String(p.id),
      name: p.name || "",
      gender: p.gender || "",
      birth: p.birth || "",
      death: p.death || "",
      spouse: p.spouse || "",
      notes: p.notes || "",
      parentId: p.parentId ? String(p.parentId) : ""
    });
  });
  seq = 0;
  data.people.forEach(function(p){
    var m = /^p(\d+)$/.exec(p.id);
    if(m && +m[1] > seq) seq = +m[1];
  });
  open.clear(); sel = null; found = null;
  elTitle.value = data.title;
  document.title = data.title + " \u2014 master";
}

/* ---------------- render ---------------- */
function nodeEl(p, seen){
  var li = document.createElement("li");
  var ch = childrenOf(p.id).filter(function(c){ return !seen.has(c.id); });
  var isOpen = open.has(p.id) && ch.length > 0;

  var n = document.createElement("div");
  n.className = "node" + (p.gender === "M" ? " male" : p.gender === "F" ? " female" : "")
              + (isOpen ? " open" : "") + (sel === p.id ? " sel" : "") + (found === p.id ? " found" : "");
  n.tabIndex = 0; n.dataset.id = p.id;

  var nm = document.createElement("div");
  nm.className = "nm notranslate"; nm.translate = false; nm.setAttribute("dir","auto"); nm.textContent = p.name || "Unnamed";
  n.appendChild(nm);
  var y = years(p);
  if(y){ var yr = document.createElement("div"); yr.className="yr"; yr.textContent=y; n.appendChild(yr); }
  if(p.spouse){ var sp = document.createElement("div"); sp.className="sp notranslate"; sp.translate = false; sp.setAttribute("dir","auto"); sp.textContent="\u00D7 " + p.spouse; n.appendChild(sp); }
  if(ch.length){ var b = document.createElement("span"); b.className="kids"; b.textContent = isOpen ? "\u2212" : "+" + ch.length; n.appendChild(b); }

  li.appendChild(n);
  if(isOpen){
    var s2 = new Set(seen); s2.add(p.id);
    var ul = document.createElement("ul");
    ch.forEach(function(c){ ul.appendChild(nodeEl(c, s2)); });
    li.appendChild(ul);
  }
  return li;
}
function render(){
  index();
  elTree.innerHTML = "";
  var rs = roots();
  if(!rs.length){
    var d = document.createElement("div"); d.className = "blank";
    d.textContent = "No one here yet. Add the oldest ancestor with \u201CAdd person at top\u201D, or import a CSV.";
    elTree.appendChild(d);
  }else{
    var ul = document.createElement("ul");
    rs.forEach(function(p){ ul.appendChild(nodeEl(p, new Set())); });
    elTree.appendChild(ul);
  }
  applyZoom();
  document.getElementById("count").textContent = data.people.length + " people";
  if(elFab) refreshFab();
}

/* ---------------- editor rail ---------------- */
function railEmpty(){
  elRail.innerHTML = "";
  var d = document.createElement("div"); d.className = "empty";
  d.textContent = data.people.length
    ? "Click any name in the tree to edit it, add children, or move it."
    : "Start with the oldest ancestor. Everyone else hangs below him.";
  elRail.appendChild(d);
  if(!data.people.length){
    var b = document.createElement("button"); b.className="btn key"; b.textContent="Add the first person";
    b.onclick = addRoot; d.appendChild(b);
  }
}

var typing = null;
function editor(id){
  var p = byId.get(id);
  if(!p){ railEmpty(); return; }
  elRail.innerHTML = "";

  var line = [], cur = p.parentId ? byId.get(p.parentId) : null, guard = 0;
  while(cur && guard++ < 200){ line.unshift(cur); cur = cur.parentId ? byId.get(cur.parentId) : null; }
  if(line.length){
    var path = document.createElement("div"); path.className="path";
    line.forEach(function(a, i){
      if(i){ var s=document.createElement("span"); s.className="arrow"; s.textContent="\u203A"; path.appendChild(s); }
      var b=document.createElement("button"); b.type="button"; b.setAttribute("dir","auto"); b.textContent=a.name || "Unnamed";
      b.onclick=function(){ goTo(a.id); }; path.appendChild(b);
    });
    elRail.appendChild(path);
  }
  var h = document.createElement("div"); h.className="railhead"; h.textContent="Details"; elRail.appendChild(h);

  function field(key, labelText, type){
    var l = document.createElement("label"); l.textContent = labelText;
    var i = type === "area" ? document.createElement("textarea") : document.createElement("input");
    i.className = "f"; i.value = p[key] || ""; i.setAttribute("dir","auto");
    var lid = "f_" + key; i.id = lid; l.setAttribute("for", lid);
    i.addEventListener("input", function(){
      p[key] = i.value;
      clearTimeout(typing);
      typing = setTimeout(function(){ render(); save(); }, 260);
    });
    elRail.appendChild(l); elRail.appendChild(i);
    return i;
  }
  var nameInput = field("name", "Full name");

  var lg = document.createElement("label"); lg.textContent = "Gender"; lg.setAttribute("for","f_gender");
  var g = document.createElement("select"); g.className="f"; g.id="f_gender";
  [["","Not set"],["M","Male"],["F","Female"]].forEach(function(o){
    var op=document.createElement("option"); op.value=o[0]; op.textContent=o[1]; if((p.gender||"")===o[0]) op.selected=true; g.appendChild(op);
  });
  g.onchange = function(){ p.gender = g.value; render(); save(); };
  elRail.appendChild(lg); elRail.appendChild(g);

  var wrap = document.createElement("div"); wrap.className="two-up";
  elRail.appendChild(wrap);
  var holdBirth = document.createElement("div"), holdDeath = document.createElement("div");
  wrap.appendChild(holdBirth); wrap.appendChild(holdDeath);
  var realRail = elRail;
  elRail = holdBirth; field("birth", "Born");
  elRail = holdDeath; field("death", "Died");
  elRail = realRail;

  field("spouse", "Spouse");
  field("notes", "Notes", "area");

  var lp = document.createElement("label"); lp.textContent = "Child of"; lp.setAttribute("for","f_parent");
  var ps = document.createElement("select"); ps.className="f"; ps.id="f_parent";
  var banned = new Set(descendants(p.id)); banned.add(p.id);
  var o0 = document.createElement("option"); o0.value=""; o0.textContent="\u2014 no one (top of the tree)"; ps.appendChild(o0);
  data.people.forEach(function(o){
    if(banned.has(o.id)) return;
    var op = document.createElement("option"); op.value=o.id;
    op.textContent = (o.name || "Unnamed") + (o.birth ? " (" + o.birth + ")" : "");
    if(p.parentId === o.id) op.selected = true;
    ps.appendChild(op);
  });
  ps.onchange = function(){ p.parentId = ps.value; if(ps.value) open.add(ps.value); render(); save(); editor(p.id); };
  elRail.appendChild(lp); elRail.appendChild(ps);

  var acts = document.createElement("div"); acts.className="acts"; elRail.appendChild(acts);
  function act(text, fn, cls){
    var b = document.createElement("button"); b.className = "btn" + (cls ? " " + cls : ""); b.textContent = text;
    b.onclick = fn; acts.appendChild(b); return b;
  }
  act("Add child", function(){ addChild(p.id); }, "key");
  act("Add brother or sister", function(){ addSibling(p.id); });
  var sibs = p.parentId && byId.has(p.parentId) ? childrenOf(p.parentId) : roots();
  var pos = sibs.findIndex(function(s){ return s.id === p.id; });
  act("Move up", function(){ reorder(p.id, -1); }).disabled = pos <= 0;
  act("Move down", function(){ reorder(p.id, 1); }).disabled = pos < 0 || pos >= sibs.length - 1;

  var div = document.createElement("div"); div.className="divider"; elRail.appendChild(div);
  var dacts = document.createElement("div"); dacts.className="acts"; elRail.appendChild(dacts);
  var del = document.createElement("button"); del.className="btn warn";
  var kidCount = descendants(p.id).length;
  del.textContent = kidCount ? "Delete with " + kidCount + " below" : "Delete this person";
  del.onclick = function(){ removePerson(p.id); };
  dacts.appendChild(del);

  return nameInput;
}

/* ---------------- edits ---------------- */
function blank(parentId){
  return {id:newId(), name:"", gender:"", birth:"", death:"", spouse:"", notes:"", parentId: parentId || ""};
}
function focusName(){
  var i = document.getElementById("f_name");
  if(i){ i.focus(); i.select(); }
}
function addRoot(){
  index();
  setRail(true);
  var p = blank("");
  data.people.push(p);
  sel = p.id; found = null;
  render(); editor(p.id); focusName(); save();
}
function addChild(parentId){
  index();
  setRail(true);
  var p = blank(parentId);
  var last = childrenOf(parentId).slice(-1)[0];
  insertAfter(p, last ? last.id : parentId);
  open.add(parentId); sel = p.id; found = null;
  render(); editor(p.id); focusName(); save();
}
function addSibling(id){
  index();
  setRail(true);
  var me = byId.get(id); if(!me) return;
  var p = blank(me.parentId || "");
  insertAfter(p, id);
  sel = p.id; found = null;
  render(); editor(p.id); focusName(); save();
}
function insertAfter(p, afterId){
  var i = data.people.findIndex(function(x){ return x.id === afterId; });
  if(i < 0) data.people.push(p); else data.people.splice(i + 1, 0, p);
}
function reorder(id, dir){
  index();
  var me = byId.get(id); if(!me) return;
  var sibs = me.parentId && byId.has(me.parentId) ? childrenOf(me.parentId) : roots();
  var i = sibs.findIndex(function(s){ return s.id === id; });
  var j = i + dir;
  if(i < 0 || j < 0 || j >= sibs.length) return;
  var a = data.people.indexOf(me), b = data.people.indexOf(sibs[j]);
  data.people[a] = sibs[j]; data.people[b] = me;
  render(); editor(id); save();
}
function removePerson(id){
  index();
  var me = byId.get(id); if(!me) return;
  var kill = descendants(id);
  var msg = kill.length
    ? "Delete " + (me.name || "this person") + " and the " + kill.length + " people below them? This cannot be undone."
    : "Delete " + (me.name || "this person") + "?";
  if(!confirm(msg)) return;
  var gone = new Set(kill); gone.add(id);
  data.people = data.people.filter(function(p){ return !gone.has(p.id); });
  gone.forEach(function(g){ open.delete(g); });
  sel = me.parentId && !gone.has(me.parentId) ? me.parentId : null;
  found = null;
  render();
  if(sel) editor(sel); else railEmpty();
  save();
}

/* ---------------- navigation ---------------- */
elTree.addEventListener("click", function(e){
  var n = e.target.closest(".node"); if(!n) return;
  var id = n.dataset.id;
  sel = id; found = null;
  if(childrenOf(id).length){ if(open.has(id)) open.delete(id); else open.add(id); }
  render(); editor(id);
});
elTree.addEventListener("keydown", function(e){
  if(e.key !== "Enter" && e.key !== " ") return;
  var n = e.target.closest(".node"); if(!n) return;
  e.preventDefault(); n.click();
});
function goTo(id){
  index();
  var p = byId.get(id); if(!p) return;
  var cur = p.parentId ? byId.get(p.parentId) : null, guard = 0;
  while(cur && guard++ < 200){ open.add(cur.id); cur = cur.parentId ? byId.get(cur.parentId) : null; }
  sel = id; found = id;
  render(); editor(id);
  var n = elTree.querySelector('.node[data-id="' + CSS.escape(id) + '"]');
  if(n) n.scrollIntoView({block:"center", inline:"center", behavior:"smooth"});
}

/* ---------------- search ---------------- */
var hitList = [], cursor = -1;
function norm(s){
  return String(s || "").toLowerCase()
    .replace(/[\u064B-\u0652\u0670]/g,"")
    .replace(/[\u0623\u0625\u0622]/g,"\u0627")
    .replace(/\u0649/g,"\u064A").replace(/\u0629/g,"\u0647");
}
function tight(s){ return norm(s).replace(/[\s\u064E-\u0652'\u2019.-]/g,""); }
function hit(hay, q){
  if(!q) return false;
  if(norm(hay).indexOf(q) > -1) return true;
  var t = q.replace(/\s+/g,"");
  return t.length > 1 && tight(hay).indexOf(t) > -1;
}
function search(){
  var q = norm(elQ.value.trim());
  elHits.innerHTML = ""; hitList = []; cursor = -1;
  if(!q){ elHits.classList.remove("on"); return; }
  index();
  var out = [];
  for(var i = 0; i < data.people.length && out.length < 40; i++){
    var p = data.people[i];
    if(hit(p.name, q) || hit(p.spouse, q)) out.push(p);
  }
  hitList = out;
  if(!out.length){
    var d = document.createElement("div"); d.className="none"; d.textContent="No match for that name.";
    elHits.appendChild(d); elHits.classList.add("on"); return;
  }
  out.forEach(function(p, i){
    var d = document.createElement("div"); d.className="hit";
    var b = document.createElement("b"); b.setAttribute("dir","auto"); b.textContent = p.name || "Unnamed";
    var s = document.createElement("span");
    var par = p.parentId ? byId.get(p.parentId) : null;
    s.textContent = [par ? "child of " + (par.name || "Unnamed") : "top of the tree", years(p)].filter(Boolean).join("  \u00B7  ");
    d.appendChild(b); d.appendChild(s);
    d.onclick = function(){ elHits.classList.remove("on"); goTo(p.id); };
    elHits.appendChild(d);
  });
  elHits.classList.add("on");
}
elQ.addEventListener("input", search);
elQ.addEventListener("focus", function(){ if(elQ.value) search(); });
elQ.addEventListener("keydown", function(e){
  if(e.key === "Escape"){ elHits.classList.remove("on"); return; }
  if(!hitList.length) return;
  if(e.key === "ArrowDown" || e.key === "ArrowUp"){
    e.preventDefault();
    cursor += (e.key === "ArrowDown" ? 1 : -1);
    if(cursor < 0) cursor = hitList.length - 1;
    if(cursor >= hitList.length) cursor = 0;
    Array.prototype.forEach.call(elHits.children, function(c,i){ c.classList.toggle("cursor", i === cursor); });
    var c = elHits.children[cursor]; if(c) c.scrollIntoView({block:"nearest"});
  }
  if(e.key === "Enter"){
    e.preventDefault();
    var p = hitList[cursor < 0 ? 0 : cursor];
    if(p){ elHits.classList.remove("on"); elQ.blur(); goTo(p.id); }
  }
});
document.addEventListener("click", function(e){ if(!e.target.closest(".find")) elHits.classList.remove("on"); });

/* ---------------- files ---------------- */
function toast(msg){
  elToast.textContent = msg; elToast.classList.remove("hide");
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ elToast.classList.add("hide"); }, 3600);
}
function slug(){
  return (data.title || "family-tree").replace(/[^\w\u0600-\u06FF\- ]+/g,"").trim().replace(/\s+/g,"-") || "family-tree";
}
function download(content, filename, mime){
  var blob = new Blob([content], {type: mime});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}
function csvCell(v){ v = v == null ? "" : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }
function toCsv(){
  index();
  var lines = ["id,name,gender,birth,death,spouse,notes,parent_id,parent_name"];
  data.people.forEach(function(p){
    var par = p.parentId ? byId.get(p.parentId) : null;
    lines.push([p.id,p.name,p.gender,p.birth,p.death,p.spouse,p.notes,p.parentId||"",par?par.name:""].map(csvCell).join(","));
  });
  return "\uFEFF" + lines.join("\r\n");
}
function parseCsv(text){
  text = text.replace(/^\uFEFF/,"").replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  var rows = [], row = [], field = "", inQ = false;
  for(var i = 0; i < text.length; i++){
    var c = text[i];
    if(inQ){
      if(c === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else inQ = false; }
      else field += c;
    }else{
      if(c === '"') inQ = true;
      else if(c === ","){ row.push(field); field = ""; }
      else if(c === "\n"){ row.push(field); field = ""; rows.push(row); row = []; }
      else field += c;
    }
  }
  if(field !== "" || row.length){ row.push(field); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(x){ return String(x).trim() !== ""; }); });
}
function importCsvText(text){
  var rows = parseCsv(text);
  if(rows.length < 2){ toast("That CSV has no rows to read."); return; }
  var head = rows[0].map(function(h){ return h.trim().toLowerCase().replace(/[\s_-]+/g,""); });
  function col(){ 
    for(var a = 0; a < arguments.length; a++){
      var i = head.indexOf(arguments[a]);
      if(i > -1) return i;
    }
    return -1;
  }
  var cId = col("id","personid"), cName = col("name","fullname","person"),
      cG = col("gender","sex"), cB = col("birth","born","birthyear","dateofbirth"),
      cD = col("death","died","deathyear","dateofdeath"), cS = col("spouse","wife","husband","partner"),
      cN = col("notes","note","remarks"), cP = col("parentid","parent","fatherid"),
      cPN = col("parentname","fathername","father");
  if(cName < 0){ toast("The CSV needs a column named name."); return; }

  var people = [], usedIds = new Set(), byName = new Map();
  for(var r = 1; r < rows.length; r++){
    var row = rows[r];
    var pick = function(i){ return i > -1 && row[i] != null ? String(row[i]).trim() : ""; };
    var id = cId > -1 ? pick(cId) : "";
    if(!id || usedIds.has(id)) id = "r" + r;
    usedIds.add(id);
    var name = pick(cName);
    var gRaw = pick(cG).toLowerCase();
    var gender = /^(f|female|girl|woman|w|\u0623\u0646\u062B\u0649|\u0627\u0646\u062B\u0649|\u0628\u0646\u062A|\u0641)/.test(gRaw) ? "F" : (gRaw ? "M" : "");
    var p = {id:id, name:name, gender:gender,
             birth:pick(cB), death:pick(cD), spouse:pick(cS), notes:pick(cN),
             parentId: cP > -1 ? pick(cP) : "", _pname: cPN > -1 ? pick(cPN) : ""};
    if(name && !byName.has(name)) byName.set(name, id);
    people.push(p);
  }
  people.forEach(function(p){
    if(!p.parentId && p._pname && byName.has(p._pname) && byName.get(p._pname) !== p.id) p.parentId = byName.get(p._pname);
    delete p._pname;
  });
  var ids = new Set(people.map(function(p){ return p.id; }));
  people.forEach(function(p){ if(p.parentId && !ids.has(p.parentId)) p.parentId = ""; });

  adopt({title: data.title, people: people});
  render(); railEmpty(); save();
  toast("Imported " + people.length + " people.");
}

document.getElementById("exportCsv").onclick = function(){
  if(!data.people.length){ toast("Add someone first, then the CSV will have rows."); return; }
  download(toCsv(), slug() + ".csv", "text/csv;charset=utf-8");
};
document.getElementById("saveJson").onclick = function(){
  download(JSON.stringify(data, null, 2), slug() + "-master-data.json", "application/json");
  toast("Tree file saved. Keep it as your backup.");
};
var pickMode = "json";
document.getElementById("openJson").onclick = function(){ pickMode = "json"; elFile.accept = ".json,application/json"; elFile.click(); };
document.getElementById("importCsv").onclick = function(){ pickMode = "csv"; elFile.accept = ".csv,text/csv"; elFile.click(); };
elFile.onchange = function(){
  var f = elFile.files && elFile.files[0]; if(!f) return;
  var reader = new FileReader();
  reader.onload = function(){
    var text = String(reader.result);
    try{
      if(pickMode === "csv" || /\.csv$/i.test(f.name)){
        if(data.people.length && !confirm("Importing replaces the " + data.people.length + " people already here. Continue?")) return;
        importCsvText(text);
      }else{
        var d = JSON.parse(text);
        if(!d || !Array.isArray(d.people)) throw new Error("bad file");
        if(data.people.length && !confirm("Opening this file replaces the tree currently on screen. Continue?")) return;
        adopt(d); render(); railEmpty(); save();
        toast("Opened " + data.people.length + " people.");
      }
    }catch(err){
      toast("That file could not be read. Use a tree file saved from here, or a CSV.");
    }
  };
  reader.readAsText(f, "utf-8");
  elFile.value = "";
};

/* ---------------- publish ---------------- */
document.getElementById("publish").onclick = function(){
  if(!data.people.length){ toast("Add at least one person before publishing."); return; }
  var bin = atob(VIEWER_B64);
  var bytes = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  var html = new TextDecoder("utf-8").decode(bytes);
  var payload = JSON.stringify({title: data.title, people: data.people})
    .replace(/</g,"\\u003c").replace(/\u2028/g,"\\u2028").replace(/\u2029/g,"\\u2029");
  var marker = "/*__FAMILY_DATA__*/null/*__END_DATA__*/";
  if(html.indexOf(marker) < 0){ toast("The viewer template inside this file is damaged."); return; }
  html = html.replace(marker, payload);
  download(html, slug() + "-view.html", "text/html;charset=utf-8");
  toast("Published. Share the downloaded file \u2014 it opens in any browser and cannot be edited.");
};

/* ---------------- toolbar ---------------- */
document.getElementById("addRoot").onclick = addRoot;
document.getElementById("collapse").onclick = function(){ open.clear(); found = null; render(); };
document.getElementById("expand").onclick = function(){ open.clear(); data.people.forEach(function(p){ open.add(p.id); }); found = null; render(); };
document.getElementById("zoomIn").onclick = function(){ zoom = Math.min(1.6, zoom + .1); applyZoom(); };
document.getElementById("zoomOut").onclick = function(){ zoom = Math.max(.4, zoom - .1); applyZoom(); };
document.getElementById("print").onclick = function(){ window.print(); };
document.getElementById("wipe").onclick = function(){
  if(!confirm("Clear this tree and start with an empty one? Save a tree file first if you want to keep it.")) return;
  adopt({title:"Family tree", people:[]});
  render(); railEmpty(); save();
};
elTitle.addEventListener("input", function(){
  data.title = elTitle.value;
  document.title = (data.title || "Family tree") + " \u2014 master";
  clearTimeout(elTitle._t); elTitle._t = setTimeout(save, 300);
});
window.addEventListener("beforeunload", function(e){
  if(!storageOk && data.people.length){ e.preventDefault(); e.returnValue = ""; }
});


/* ---------- details panel show / hide ---------- */
var railOff = false;
var elFab = document.getElementById("fab");
function selectedName(){
  var p = sel ? byId.get(sel) : null;
  return p && p.name ? p.name : "";
}
function refreshFab(){
  var n = selectedName();
  elFab.textContent = n ? "Details: " + n : "Details";
  elFab.setAttribute("dir", n ? "auto" : "ltr");
}
function setRail(open){
  railOff = !open;
  document.body.classList.toggle("rail-off", railOff);
  document.getElementById("toggleRail").setAttribute("aria-expanded", String(open));
  refreshFab();
}
document.getElementById("toggleRail").onclick = function(){ setRail(railOff); };
document.getElementById("closeRail").onclick = function(){ setRail(false); };
elFab.onclick = function(){ setRail(true); };
document.addEventListener("keydown", function(e){
  if(e.key !== "Escape" || railOff) return;
  if(document.activeElement === elQ) return;
  setRail(false);
});

/* ---------------- start ---------------- */
load();
render();
railEmpty();
setRail(window.innerWidth > 900);
elSaved.textContent = storageOk ? "Saved in this browser" : "Not saved automatically \u2014 use Save tree file";
})();
</script>
