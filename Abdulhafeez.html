<style>
:root{
  --paper:#e9edf0;
  --card:#ffffff;
  --ink:#16232e;
  --muted:#5c7183;
  --rule:#aebecb;
  --edge:#d3dde4;
  --accent:#1f6f6b;
  --accent-wash:#dff0ed;
  --find:#f6e2ad;
  --sans:"Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans Arabic",sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman","Noto Naskh Arabic",serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  direction:ltr;
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:14px;
  display:flex;flex-direction:column;overflow:hidden;
}
button{font:inherit;color:inherit}

/* ---------- top bar ---------- */
.bar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px 16px;background:var(--card);
  border-bottom:1px solid var(--edge);z-index:5;
}
.bar h1{
  font-family:var(--serif);font-size:19px;font-weight:600;
  margin:0;letter-spacing:.1px;white-space:nowrap;
}
.count{color:var(--muted);font-size:12.5px;white-space:nowrap}
.spacer{flex:1}
.btn{
  border:1px solid var(--edge);background:var(--card);
  border-radius:6px;padding:6px 11px;cursor:pointer;color:var(--ink);
}
.btn:hover{border-color:var(--rule);background:#f4f7f9}
.btn:focus-visible,input:focus-visible,.node:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- search ---------- */
.find{position:relative}
.find input{
  font:inherit;width:230px;padding:7px 10px;border:1px solid var(--edge);
  border-radius:6px;background:var(--card);color:var(--ink);
}
.find input::placeholder{color:var(--muted)}
.hits{
  position:absolute;top:calc(100% + 6px);left:0;width:300px;max-height:320px;
  overflow:auto;background:var(--card);border:1px solid var(--edge);
  border-radius:8px;box-shadow:0 12px 28px rgba(22,35,46,.16);display:none;z-index:20;
}
.hits.on{display:block}
.hit{padding:8px 11px;cursor:pointer;border-bottom:1px solid #f0f4f6}
.hit:last-child{border-bottom:0}
.hit:hover,.hit.cursor{background:var(--accent-wash)}
.hit b{font-family:var(--serif);font-weight:600;display:block}
.hit span{color:var(--muted);font-size:12px}
.hits .none{padding:10px 11px;color:var(--muted)}

/* ---------- layout ---------- */
.main{flex:1;display:flex;min-height:0}
.canvas{flex:1;overflow:auto;padding:34px 40px 90px;min-width:0}
.rail{
  width:300px;flex:none;background:var(--card);border-left:1px solid var(--edge);
  overflow:auto;padding:20px;
}
.rail .empty{color:var(--muted);line-height:1.6}
.rail h2{font-family:var(--serif);font-size:21px;margin:0 0 2px;font-weight:600;line-height:1.25}
.rail .sub{color:var(--muted);margin-bottom:16px}
.row{display:flex;gap:10px;padding:7px 0;border-top:1px solid #eef2f5;font-size:13.5px}
.row .k{width:74px;flex:none;color:var(--muted)}
.row .v{flex:1;white-space:pre-wrap;word-break:break-word}
.rail h3{font-size:12.5px;font-weight:600;color:var(--muted);margin:20px 0 6px}
.chip{
  display:block;width:100%;text-align:start;border:1px solid var(--edge);background:var(--card);
  border-radius:6px;padding:6px 9px;margin-bottom:5px;cursor:pointer;font-family:var(--serif);font-size:14px;
}
.chip:hover{border-color:var(--accent);background:var(--accent-wash)}
.path{font-size:12.5px;color:var(--muted);line-height:1.7;margin-bottom:14px}
.path button{background:none;border:0;padding:0;cursor:pointer;color:var(--accent);text-decoration:underline}
.path .sep{padding:0 5px;color:var(--rule)}

/* ---------- tree ---------- */
.tree{display:inline-block;min-width:100%}
.tree ul{
  display:flex;justify-content:center;list-style:none;
  margin:0;padding:26px 0 0;position:relative;
}
.tree li{
  list-style:none;position:relative;
  padding:26px 7px 0;display:flex;flex-direction:column;align-items:center;
}
.tree li::before,.tree li::after{
  content:"";position:absolute;top:0;right:50%;width:50%;height:26px;
  border-top:1.5px solid var(--rule);
}
.tree li::after{right:auto;left:50%;border-top:1.5px solid var(--rule);border-left:1.5px solid var(--rule)}
.tree li:only-child::before,.tree li:only-child::after{display:none}
.tree li:only-child{padding-top:0}
.tree li:first-child::before,.tree li:last-child::after{border:0 none}
.tree li:last-child::before{border-right:1.5px solid var(--rule);border-radius:0 7px 0 0}
.tree li:first-child::after{border-radius:7px 0 0 0}
.tree ul ul::before{
  content:"";position:absolute;top:0;left:50%;height:26px;
  border-left:1.5px solid var(--rule);
}
.tree>ul{padding-top:0;gap:36px}
.tree>ul>li{padding-top:0}
.tree>ul>li::before,.tree>ul>li::after{display:none}

.node{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;
  min-width:124px;max-width:200px;padding:9px 14px 9px;
  background:var(--card);border:1px solid var(--edge);border-top:3px solid var(--rule);
  border-radius:3px;cursor:pointer;text-align:center;
  transition:border-color .12s,box-shadow .12s;
}
.node.male{border-top-color:#4a7fa5}
.node.female{border-top-color:#a2628c}
.node:hover{border-color:var(--accent)}
.node.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
.node.found{background:var(--find)}
.node .nm{font-family:var(--serif);font-size:15px;line-height:1.3;font-weight:600}
.node .yr{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.node .sp{font-size:11.5px;color:var(--muted);font-style:italic}
.node .kids{
  position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);
  min-width:24px;height:20px;padding:0 6px;border-radius:10px;
  background:var(--card);border:1.5px solid var(--rule);color:var(--muted);
  font-size:11.5px;line-height:17px;font-variant-numeric:tabular-nums;
}
.node.open .kids{background:var(--accent);border-color:var(--accent);color:#fff}
.leaf{cursor:default}
.leaf:hover{border-color:var(--edge)}
.band{display:inline-flex;align-items:center;gap:7px;max-width:210px;padding:3px 11px;
  border:1px dashed var(--rule);border-radius:14px;background:#eef3f6;color:var(--muted);
  font-family:var(--serif);font-size:13px;line-height:1.55;cursor:pointer}
.band::before{content:"\2640";font-family:var(--sans);font-size:12px;color:var(--rule)}
.band:hover{border-color:var(--accent);color:var(--ink)}
.band:hover::before{color:var(--accent)}
.band .bname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.band .bcount{font-family:var(--sans);font-size:11px;border:1px solid var(--edge);background:var(--card);
  border-radius:9px;padding:0 6px;line-height:16px;font-variant-numeric:tabular-nums}
.band.shut{border-style:solid;background:var(--card);color:var(--ink)}
.grouphead{font-size:12px;color:var(--muted);margin:13px 0 5px;padding-bottom:3px;border-bottom:1px dashed var(--edge)}
.blank{color:var(--muted);padding:60px 0;text-align:center;line-height:1.7}

@media (max-width:820px){
  .rail{position:fixed;inset:auto 0 0 0;width:auto;max-height:46vh;padding:12px 16px 22px;
        border-left:0;border-top:1px solid var(--edge);border-radius:13px 13px 0 0;
        box-shadow:0 -8px 24px rgba(22,35,46,.18);transform:translateY(0);transition:transform .18s ease}
  body.rail-off .rail{display:block;transform:translateY(104%);box-shadow:none}
  .sheet-grip{justify-content:space-between}
  .sheet-label{display:block}
  .canvas{padding:20px 16px 50vh}
  body.rail-off .canvas{padding-bottom:88px}
  .fab{display:block}
  body:not(.rail-off) .fab{display:none}
  .find input{width:150px}
}

.sheet-grip{display:flex;align-items:center;justify-content:flex-end;gap:8px;position:sticky;top:0;
  background:var(--card);padding:0 0 8px;z-index:3}
.sheet-label{display:none;font-size:12.5px;color:var(--muted)}
.sheet-grip .x{border:1px solid var(--edge);background:var(--card);border-radius:6px;
  width:30px;height:28px;line-height:1;cursor:pointer;color:var(--muted);font-size:16px;padding:0}
.sheet-grip .x:hover{border-color:var(--rule);color:var(--ink)}
.fab{display:none;position:fixed;right:14px;bottom:14px;z-index:40;max-width:62vw;
  border:1px solid var(--edge);background:var(--card);border-radius:22px;padding:10px 17px;
  box-shadow:0 6px 18px rgba(22,35,46,.2);cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.rail-off .rail{display:none}

@media print{
  .bar,.rail,.fab{display:none}
  body{background:#fff;overflow:visible;height:auto}
  .canvas{overflow:visible;padding:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="bar">
  <h1 id="title">Family tree</h1>
  <span class="count" id="count"></span>
  <div class="find">
    <input id="q" type="search" dir="auto" placeholder="Search for a name" autocomplete="off">
    <div class="hits" id="hits"></div>
  </div>
  <span class="spacer"></span>
  <button class="btn" id="toggleRail" aria-expanded="true">Details panel</button>
  <button class="btn" id="collapse">Collapse all</button>
  <button class="btn" id="expand">Expand all</button>
  <button class="btn" id="zoomOut">&minus;</button>
  <button class="btn" id="zoomIn">+</button>
  <button class="btn" id="csv">Download CSV</button>
  <button class="btn" id="print">Print</button>
</div>

<div class="main">
  <div class="canvas" id="canvas"><div class="tree notranslate" id="tree" translate="no"></div></div>
  <aside class="rail" id="rail">
    <div class="sheet-grip"><span class="sheet-label">Details</span><button class="x" id="closeRail" aria-label="Close the details panel" title="Close">×</button></div>
    <div id="railBody" class="notranslate" translate="no"></div>
  </aside>
</div>

<button class="fab" id="fab">Details</button>

<script>
(function(){
"use strict";
var DATA = window.__DATA__ || {title:"Family tree", people:[]};
var PEOPLE = DATA.people || [];
var byId = new Map(), kids = new Map();
var open = new Set(), closedGroups = new Set(), sel = null, found = null, zoom = 1;

var elTree = document.getElementById("tree");
var elCanvas = document.getElementById("canvas");
var elRail = document.getElementById("railBody");
var elHits = document.getElementById("hits");
var elQ = document.getElementById("q");

var canZoom = !!(window.CSS && CSS.supports && CSS.supports("zoom","1.5"));
function applyZoom(){
  if(canZoom){ elTree.style.zoom = zoom; }
  else { elTree.style.transform = "scale(" + zoom + ")"; elTree.style.transformOrigin = "top center"; }
}
function index(){
  byId.clear(); kids.clear();
  PEOPLE.forEach(function(p){ byId.set(p.id, p); });
  PEOPLE.forEach(function(p){
    var k = (p.parentId && byId.has(p.parentId) && p.parentId !== p.id) ? p.parentId : "__root__";
    if(!kids.has(k)) kids.set(k, []);
    kids.get(k).push(p);
  });
}
function childrenOf(id){ return kids.get(id) || []; }
function roots(){ return kids.get("__root__") || []; }
function wivesOf(p){
  if(!p) return [];
  if(!Array.isArray(p.spouses)) p.spouses = p.spouse ? [{id: p.id + "w1", name: String(p.spouse)}] : [];
  return p.spouses;
}
function wifeName(father, mid){
  var ws = wivesOf(father);
  for(var i = 0; i < ws.length; i++) if(ws[i].id === mid) return ws[i].name || "";
  return "";
}
function groupKids(p, ch){
  var order = [], map = {}, unknown = {key:"", label:"", kids:[]};
  wivesOf(p).forEach(function(w){ map[w.id] = {key:w.id, label:w.name || "", kids:[]}; order.push(map[w.id]); });
  ch.forEach(function(c){ (c.motherId && map[c.motherId] ? map[c.motherId] : unknown).kids.push(c); });
  var out = order.filter(function(g){ return g.kids.length; });
  if(unknown.kids.length) out.push(unknown);
  return out;
}
function toggleGroup(gid){
  if(closedGroups.has(gid)) closedGroups.delete(gid); else closedGroups.add(gid);
  render();
}
function years(p){
  if(p.birth && p.death) return p.birth + " \u2013 " + p.death;
  if(p.birth) return "b. " + p.birth;
  if(p.death) return "d. " + p.death;
  return "";
}
function esc(s){ return String(s == null ? "" : s); }

/* ---------- render ---------- */
function nodeEl(p, seen){
  var li = document.createElement("li");
  var ch = childrenOf(p.id).filter(function(c){ return !seen.has(c.id); });
  var isOpen = open.has(p.id) && ch.length > 0;

  var n = document.createElement("div");
  n.className = "node" + (p.gender === "M" ? " male" : p.gender === "F" ? " female" : "")
              + (isOpen ? " open" : "") + (sel === p.id ? " sel" : "")
              + (found === p.id ? " found" : "") + (ch.length ? "" : " leaf");
  n.tabIndex = 0;
  n.dataset.id = p.id;

  var nm = document.createElement("div");
  nm.className = "nm notranslate"; nm.translate = false; nm.setAttribute("dir","auto"); nm.textContent = esc(p.name) || "Unnamed";
  n.appendChild(nm);

  var y = years(p);
  if(y){ var yr = document.createElement("div"); yr.className = "yr"; yr.textContent = y; n.appendChild(yr); }
  wivesOf(p).forEach(function(w){
    if(!w.name) return;
    var sp = document.createElement("div"); sp.className="sp notranslate"; sp.translate = false;
    sp.setAttribute("dir","auto"); sp.textContent = "\u00D7 " + w.name; n.appendChild(sp);
  });
  if(ch.length){ var b = document.createElement("span"); b.className="kids"; b.textContent = isOpen ? "\u2212" : "+" + ch.length; n.appendChild(b); }

  li.appendChild(n);
  if(isOpen){
    var s2 = new Set(seen); s2.add(p.id);
    var ul = document.createElement("ul");
    var groups = groupKids(p, ch);
    if(groups.length > 1){
      groups.forEach(function(g){
        var gid = p.id + "::" + g.key;
        var shut = closedGroups.has(gid);
        var gli = document.createElement("li"); gli.className = "grp";
        var band = document.createElement("div");
        band.className = "band notranslate" + (shut ? " shut" : "");
        band.translate = false; band.dataset.gid = gid; band.tabIndex = 0;
        band.title = g.label ? "Children of " + g.label : "Mother not recorded";
        var bn = document.createElement("span"); bn.className = "bname"; bn.setAttribute("dir","auto");
        bn.textContent = g.label || "mother not recorded";
        var bc = document.createElement("span"); bc.className = "bcount"; bc.textContent = g.kids.length;
        band.appendChild(bn); band.appendChild(bc);
        gli.appendChild(band);
        if(!shut){
          var gul = document.createElement("ul");
          g.kids.forEach(function(c){ gul.appendChild(nodeEl(c, s2)); });
          gli.appendChild(gul);
        }
        ul.appendChild(gli);
      });
    }else{
      ch.forEach(function(c){ ul.appendChild(nodeEl(c, s2)); });
    }
    li.appendChild(ul);
  }
  return li;
}

function render(){
  index();
  var rs = roots();
  elTree.innerHTML = "";
  if(!rs.length){
    var d = document.createElement("div");
    d.className = "blank";
    d.textContent = "This tree is empty.";
    elTree.appendChild(d);
    return;
  }
  var ul = document.createElement("ul");
  rs.forEach(function(p){ ul.appendChild(nodeEl(p, new Set())); });
  elTree.appendChild(ul);
  applyZoom();
  document.getElementById("count").textContent = PEOPLE.length + " people";
  if(elFab) refreshFab();
}

/* ---------- interaction ---------- */
elTree.addEventListener("click", function(e){
  var band = e.target.closest(".band");
  if(band){ toggleGroup(band.dataset.gid); return; }
  var n = e.target.closest(".node"); if(!n) return;
  toggle(n.dataset.id, true);
});
elTree.addEventListener("keydown", function(e){
  if(e.key !== "Enter" && e.key !== " ") return;
  var band = e.target.closest(".band");
  if(band){ e.preventDefault(); toggleGroup(band.dataset.gid); return; }
  var n = e.target.closest(".node"); if(!n) return;
  e.preventDefault(); toggle(n.dataset.id, true);
});
function toggle(id, select){
  if(select) sel = id;
  if(childrenOf(id).length){ if(open.has(id)) open.delete(id); else open.add(id); }
  found = null;
  render(); detail(id);
}

function detail(id){
  var p = byId.get(id);
  if(!p){ elRail.innerHTML = '<div class="empty">Select a name to see their details.</div>'; return; }
  elRail.innerHTML = "";

  var line = [];
  var cur = p.parentId ? byId.get(p.parentId) : null, guard = 0;
  while(cur && guard++ < 200){ line.unshift(cur); cur = cur.parentId ? byId.get(cur.parentId) : null; }
  if(line.length){
    var path = document.createElement("div"); path.className = "path";
    line.forEach(function(a, i){
      if(i){ var s = document.createElement("span"); s.className="sep"; s.textContent="\u203A"; path.appendChild(s); }
      var b = document.createElement("button"); b.type="button"; b.textContent = a.name; b.setAttribute("dir","auto");
      b.onclick = function(){ goTo(a.id); };
      path.appendChild(b);
    });
    elRail.appendChild(path);
  }

  var h = document.createElement("h2"); h.setAttribute("dir","auto"); h.textContent = esc(p.name) || "Unnamed";
  elRail.appendChild(h);
  var sub = document.createElement("div"); sub.className="sub";
  sub.textContent = [years(p), p.gender === "M" ? "Male" : p.gender === "F" ? "Female" : ""].filter(Boolean).join("  \u00B7  ");
  elRail.appendChild(sub);

  function row(k, v){
    if(!v) return;
    var r = document.createElement("div"); r.className="row";
    var a = document.createElement("div"); a.className="k"; a.textContent=k;
    var b = document.createElement("div"); b.className="v"; b.setAttribute("dir","auto"); b.textContent=v;
    r.appendChild(a); r.appendChild(b); elRail.appendChild(r);
  }
  row("Born", p.birth); row("Died", p.death);
  var ws = wivesOf(p).map(function(w){ return w.name; }).filter(Boolean);
  if(ws.length) row(ws.length > 1 ? "Wives" : "Spouse", ws.join("\n"));
  var dad = p.parentId ? byId.get(p.parentId) : null;
  if(dad){ var mum = wifeName(dad, p.motherId); if(mum) row("Mother", mum); }
  row("Notes", p.notes);

  var ch = childrenOf(p.id);
  if(ch.length){
    var h3 = document.createElement("h3"); h3.textContent = "Children (" + ch.length + ")";
    elRail.appendChild(h3);
    var gs = groupKids(p, ch);
    gs.forEach(function(g){
      if(gs.length > 1){
        var gh = document.createElement("div"); gh.className = "grouphead"; gh.setAttribute("dir","auto");
        gh.textContent = (g.label || "mother not recorded") + "  \u00B7  " + g.kids.length;
        elRail.appendChild(gh);
      }
      g.kids.forEach(function(c){
        var b = document.createElement("button"); b.className="chip"; b.type="button";
        b.setAttribute("dir","auto"); b.textContent = c.name;
        b.onclick = function(){ goTo(c.id); };
        elRail.appendChild(b);
      });
    });
  }
}

function goTo(id){
  var p = byId.get(id); if(!p) return;
  var kid = p, cur = p.parentId ? byId.get(p.parentId) : null, guard = 0;
  while(cur && guard++ < 200){
    open.add(cur.id);
    closedGroups.delete(cur.id + "::" + (kid.motherId || ""));
    kid = cur; cur = cur.parentId ? byId.get(cur.parentId) : null;
  }
  sel = id; found = id;
  render(); detail(id);
  var n = elTree.querySelector('.node[data-id="' + CSS.escape(id) + '"]');
  if(n) n.scrollIntoView({block:"center", inline:"center", behavior:"smooth"});
}

/* ---------- search ---------- */
var hitList = [], cursor = -1;
function norm(s){
  return String(s || "").toLowerCase()
    .replace(/[\u064B-\u0652\u0670]/g, "")
    .replace(/[\u0623\u0625\u0622]/g, "\u0627")
    .replace(/\u0649/g, "\u064A").replace(/\u0629/g, "\u0647");
}
function tight(s){ return norm(s).replace(/[\s\u064E-\u0652'\u2019.-]/g,""); }
function hit(hay, q){
  if(!q) return false;
  if(norm(hay).indexOf(q) > -1) return true;
  var t = q.replace(/\s+/g,"");
  return t.length > 1 && tight(hay).indexOf(t) > -1;
}
function search(){
  var q = norm(elQ.value.trim());
  elHits.innerHTML = ""; hitList = []; cursor = -1;
  if(q.length < 1){ elHits.classList.remove("on"); return; }
  var out = [];
  for(var i = 0; i < PEOPLE.length && out.length < 40; i++){
    var p = PEOPLE[i];
    if(hit(p.name, q) || wivesOf(p).some(function(w){ return hit(w.name, q); })) out.push(p);
  }
  hitList = out;
  if(!out.length){
    var d = document.createElement("div"); d.className="none"; d.textContent = "No match for that name.";
    elHits.appendChild(d); elHits.classList.add("on"); return;
  }
  out.forEach(function(p, i){
    var d = document.createElement("div"); d.className="hit"; d.dataset.i = i;
    var b = document.createElement("b"); b.setAttribute("dir","auto"); b.textContent = p.name;
    var s = document.createElement("span");
    var par = p.parentId ? byId.get(p.parentId) : null;
    s.textContent = [par ? "child of " + par.name : "top of the tree", years(p)].filter(Boolean).join("  \u00B7  ");
    d.appendChild(b); d.appendChild(s);
    d.onclick = function(){ pick(i); };
    elHits.appendChild(d);
  });
  elHits.classList.add("on");
}
function pick(i){
  var p = hitList[i]; if(!p) return;
  elHits.classList.remove("on"); elQ.blur();
  goTo(p.id);
}
elQ.addEventListener("input", search);
elQ.addEventListener("focus", function(){ if(elQ.value) search(); });
elQ.addEventListener("keydown", function(e){
  if(e.key === "Escape"){ elHits.classList.remove("on"); return; }
  if(!hitList.length) return;
  if(e.key === "ArrowDown" || e.key === "ArrowUp"){
    e.preventDefault();
    cursor += (e.key === "ArrowDown" ? 1 : -1);
    if(cursor < 0) cursor = hitList.length - 1;
    if(cursor >= hitList.length) cursor = 0;
    Array.prototype.forEach.call(elHits.children, function(c, i){ c.classList.toggle("cursor", i === cursor); });
    var c = elHits.children[cursor]; if(c) c.scrollIntoView({block:"nearest"});
  }
  if(e.key === "Enter"){ e.preventDefault(); pick(cursor < 0 ? 0 : cursor); }
});
document.addEventListener("click", function(e){
  if(!e.target.closest(".find")) elHits.classList.remove("on");
});

/* ---------- toolbar ---------- */
document.getElementById("collapse").onclick = function(){ open.clear(); found = null; render(); };
document.getElementById("expand").onclick = function(){
  open.clear(); PEOPLE.forEach(function(p){ open.add(p.id); }); found = null; render();
};
document.getElementById("zoomIn").onclick = function(){ zoom = Math.min(1.6, zoom + .1); applyZoom(); };
document.getElementById("zoomOut").onclick = function(){ zoom = Math.max(.4, zoom - .1); applyZoom(); };
document.getElementById("print").onclick = function(){ window.print(); };
document.getElementById("csv").onclick = function(){
  var cols = ["id","name","gender","birth","death","spouses","notes","parent_id","parent_name","mother"];
  var q = function(v){ v = v == null ? "" : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
  var lines = [cols.join(",")];
  PEOPLE.forEach(function(p){
    var par = p.parentId ? byId.get(p.parentId) : null;
    lines.push([p.id,p.name,p.gender,p.birth,p.death,wivesOf(p).map(function(w){return w.name;}).filter(Boolean).join(" | "),p.notes,p.parentId || "", par ? par.name : "", par ? wifeName(par, p.motherId) : ""].map(q).join(","));
  });
  var blob = new Blob(["\uFEFF" + lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (DATA.title || "family-tree").replace(/[^\w\u0600-\u06FF\- ]+/g,"").trim().replace(/\s+/g,"-") + ".csv";
  a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
};


/* ---------- details panel show / hide ---------- */
var railOff = false;
var elFab = document.getElementById("fab");
function selectedName(){
  var p = sel ? byId.get(sel) : null;
  return p && p.name ? p.name : "";
}
function refreshFab(){
  var n = selectedName();
  elFab.textContent = n ? "Details: " + n : "Details";
  elFab.setAttribute("dir", n ? "auto" : "ltr");
}
function setRail(open){
  railOff = !open;
  document.body.classList.toggle("rail-off", railOff);
  document.getElementById("toggleRail").setAttribute("aria-expanded", String(open));
  refreshFab();
}
document.getElementById("toggleRail").onclick = function(){ setRail(railOff); };
document.getElementById("closeRail").onclick = function(){ setRail(false); };
elFab.onclick = function(){ setRail(true); };
document.addEventListener("keydown", function(e){
  if(e.key !== "Escape" || railOff) return;
  if(document.activeElement === elQ) return;
  setRail(false);
});

/* ---------- start ---------- */
document.title = DATA.title || "Family tree";
document.getElementById("title").textContent = DATA.title || "Family tree";
index();
render();
setRail(window.innerWidth > 820);
elRail.innerHTML = '<div class="empty">Click a name to open it. The number under each name is how many children are hidden below.</div>';
})();
</script>
